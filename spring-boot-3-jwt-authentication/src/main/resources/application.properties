spring.application.name=spring-boot-3-jwt-authentication

# ===============================
# Datasource Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3307/securityDB
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

logging.level.root=WARN
logging.level.web=INFO
logging.level.com.example=DEBUG

# ===============================
# JWT Configuration
# ===============================

# JWT expiration is 1 hour
token.expirationms=3600000

# JWT secret key
# node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
token.secret.key=cb302fe592e4b627c93a82a073a27ad0ed778f74a03ce2cfbdb060335ef993fa